name: Collect professor profile candidates

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Save the run to the data branch (otherwise attach the report only)
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: professor-profile-collection
  cancel-in-progress: false

env:
  DATA_BRANCH: data/professor-profiles
  RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  collect:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          path: published
      - name: Locate candidate data branch
        id: data
        shell: bash
        run: |
          if git -C published ls-remote --exit-code origin "refs/heads/$DATA_BRANCH" >/dev/null; then
            echo "ref=refs/heads/$DATA_BRANCH" >> "$GITHUB_OUTPUT"
          else
            status=$?
            if [[ "$status" != 2 ]]; then exit "$status"; fi
            echo "ref=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ steps.data.outputs.ref }}
          path: candidate-store
      - name: Collect one batch from the published roster
        run: |
          python3 published/scripts/collect_professor_profiles.py \
            --output candidate-store/profile-collection --run-id "$RUN_ID"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: professor-profile-candidates
          path: candidate-store/profile-collection/runs/${{ env.RUN_ID }}.json
          if-no-files-found: error
      - name: Save candidates without changing the default branch
        if: inputs.publish
        working-directory: candidate-store
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- profile-collection/state.json "profile-collection/runs/$RUN_ID.json"
          git commit -m "Collect professor profile candidates ($RUN_ID)"
          git push origin "HEAD:refs/heads/$DATA_BRANCH"
