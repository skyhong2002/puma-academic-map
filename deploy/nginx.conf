map $http_cf_connecting_ip $comment_client_ip {
    "" $remote_addr;
    default $http_cf_connecting_ip;
}

resolver 127.0.0.11 valid=10s ipv6=off;
upstream comments_api {
    zone comments_api 64k;
    server comments:4174 resolve;
    keepalive 16;
}

server {
    listen 80;
    root /usr/share/nginx/html;

    location /api/people/ {
        access_log off;
        client_max_body_size 4k;
        client_body_timeout 10s;
        proxy_read_timeout 12s;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header X-Comment-Client-IP $comment_client_ip;
        proxy_pass http://comments_api;
    }
}
