<!doctype html>
<html lang="zh-Hant-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>台北市市長候選人沈伯洋先生學界後援會署名地圖</title>
    <meta
      name="description"
      content="以縣市地圖瀏覽學界後援會公開名單所列機構的分布，並查閱各機構官方校區地址與原站公開署名。"
    />
    <meta name="theme-color" content="#f5f1e8" />
    <link rel="icon" href="/assets/puma-favicon.ico" sizes="16x16 32x32" />
    <link rel="stylesheet" href="/src/style.css" />
    <link rel="stylesheet" href="/src/atlas.css" />
  </head>
  <body>
    <main class="map-app">
      <header class="map-toolbar">
        <div class="map-toolbar__brand">
          <button type="button" id="atlas-home" aria-label="回到地圖首頁">
            <img src="/assets/puma-signature.webp" width="40" height="40" alt="" />
          </button>
          <h1>台北市市長候選人沈伯洋先生學界後援會署名地圖</h1>
        </div>
        <div id="map-search"></div>
        <a class="map-toolbar__source" href="https://sites.google.com/view/academic-kouenkai-for-puma/" target="_blank" rel="noopener" aria-label="連署網站">
          <span class="map-toolbar__source-full">連署網站</span>
          <span class="map-toolbar__source-short">連署</span>
        </a>
      </header>
      <aside class="map-panel" id="map-panel" aria-label="名錄與詳細資料" hidden inert>
        <button type="button" id="panel-back" class="map-panel-back" hidden>
          <span aria-hidden="true">← 上一層</span><span id="panel-back-title"></span>
        </button>
        <div id="panel-content">
          <section id="home-panel" class="map-home" aria-label="地圖首頁" tabindex="-1">
            <div class="map-overview" id="map-overview" role="group" aria-label="資料概況">
              <button type="button" data-overview="leads"><strong id="overview-leads"></strong><span>共同領銜</span></button>
              <button type="button" data-overview="members"><strong id="overview-members"></strong><span>會員署名</span></button>
              <button type="button" data-overview="institutions"><strong id="overview-institutions"></strong><span>已定位機構</span></button>
              <button type="button" data-overview="comments"><strong id="overview-comments">—</strong><span>公開留言</span></button>
            </div>
            <div class="map-home__about">
              <h2>關於署名地圖</h2>
              <p>這張地圖整理支持沈伯洋的學界公開署名。點校區、系所或人物，可以查看署名與留言。</p>
              <a id="home-signup" class="map-home__signup" href="https://forms.gle/joAmvcST4U4jUX137">填寫學界後援會登記表</a>
              <details class="map-home__notes">
                <summary>資料範圍與定位說明</summary>
                <p id="map-totals"></p>
                <p>放大地圖可看已查證的系館；僅有校區座標的署名會收在校區標記。校徽用於辨識地點，署名代表個人意見。</p>
                <p><a href="https://github.com/skyhong2002/puma-academic-map">GitHub 原始碼</a> · © <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a></p>
              </details>
            </div>
            <footer class="map-home__source">
              <span>名單更新 <time id="home-updated"></time></span>
              <a id="home-source" href="https://sites.google.com/view/academic-kouenkai-for-puma/" target="_blank" rel="noopener">原始聯署網站</a>
            </footer>
          </section>
          <section id="directory" aria-label="機構與署名名錄" hidden></section>
          <section id="place-details" class="map-detail" hidden></section>
          <section id="public-comments" class="map-detail" hidden>
            <h2 tabindex="-1">公開留言</h2>
            <p id="public-comments-status" role="status"></p>
            <ul id="public-comments-list" class="map-public-comments"></ul>
            <button type="button" id="public-comments-more" class="map-campus-zoom" hidden>載入更多留言</button>
          </section>
        </div>
      </aside>
      <button type="button" id="panel-toggle" class="map-panel-toggle"
        aria-controls="map-panel" aria-expanded="false" aria-label="展開資訊面板" title="展開資訊面板"><span class="map-panel-toggle__arrow" aria-hidden="true">›</span></button>
      <div class="map-stage">
        <nav class="map-tools" aria-label="地圖工具">
          <button type="button" id="reset-map" aria-label="回到臺灣附近">回起點</button>
        </nav>
        <div id="map" class="map-app__map" aria-label="全球署名地圖"></div>
      </div>
    </main>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
